name: Zero toolkit validation

on:
  push:
    paths:
      - 'zero/**'
      - 'ZERO.md'
      - '.github/workflows/zero-toolkit.yml'
  pull_request:
    paths:
      - 'zero/**'
      - 'ZERO.md'
      - '.github/workflows/zero-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -m py_compile zero/zeroctl.py zero/brain.py zero/brain_store.py zero/brain_capture.py
      - name: Unit tests
        run: python -m unittest discover -s zero/tests -v
      - name: CLI help
        run: |
          python zero/zeroctl.py --help
          python zero/zeroctl.py brain --help
